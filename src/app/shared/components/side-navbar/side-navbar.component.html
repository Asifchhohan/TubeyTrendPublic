<!-- Desktop sidebar (hidden on mobile) -->
<div *ngIf="!(isMobile$ | async)" #sidebar class="w-64 bg-white shadow-lg fixed top-20 bottom-10 overflow-y-auto rounded-lg setMargin" [class.left-10]="position==='left'" [class.right-10]="position==='right'">
  <ul class="py-4">
    <li 
      *ngFor="let item of menuItems"
      [class.active]="item.path === activeItem"
      class="px-6 py-3 cursor-pointer hover:bg-gray-100 transition"
    >
      <a 
        [routerLink]="item.path"
        (click)="onNavClick(item, $event)"
        class="text-gray-700 font-semibold text-lg"
      >
        {{ item.name }}
      </a>
    </li>
  </ul>
</div>
