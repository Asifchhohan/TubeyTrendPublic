<app-header></app-header>

<div class="page-wrapper desktop-only">
  <main class="content">
    <h1>Contact Us</h1>
    <form #contactForm="ngForm" (ngSubmit)="submit(contactForm)">
      <div class="field">
        <label>Name</label>
        <input name="name" [(ngModel)]="formData.name" required />
        <div *ngIf="submitted && !formData.name" class="error">Name is required.</div>
      </div>

      <div class="field">
        <label>Email</label>
        <input name="email" type="email" [(ngModel)]="formData.email" required />
        <div *ngIf="submitted && !formData.email" class="error">Valid email is required.</div>
      </div>

      <div class="field">
        <label>Message</label>
        <textarea name="message" [(ngModel)]="formData.message" required></textarea>
        <div *ngIf="submitted && !formData.message" class="error">Message is required.</div>
      </div>

      <button class="btn-primary" type="submit">Submit</button>
    </form>
  </main>
</div>

<!-- Mobile view -->
<div class="page-wrapper mobile-only">
  <app-header></app-header>
  <main class="content-mobile">
    <h2>Contact Us</h2>
    <form #contactFormMobile="ngForm" (ngSubmit)="submit(contactFormMobile)">
      <label>Name</label>
      <input name="name" [(ngModel)]="formData.name" required />

      <label>Email</label>
      <input name="email" type="email" [(ngModel)]="formData.email" required />

      <label>Message</label>
      <textarea name="message" [(ngModel)]="formData.message" required></textarea>

      <button class="btn-primary" type="submit">Send</button>
    </form>
  </main>
</div>

<app-footer></app-footer>
